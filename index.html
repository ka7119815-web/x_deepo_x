*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#000;color:#fff;min-height:100vh}
.top{position:relative;height:520px;overflow:hidden}
.top img{width:100%;height:100%;object-fit:cover;object-position:top}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,#000 95%)}
.wrap{position:relative;margin-top:-90px;z-index:2;max-width:440px;margin-left:auto;margin-right:auto;padding:0 18px 25px;text-align:center}
.name-box{background:linear-gradient(180deg,#1a0a2e,#0a0a0a);border:2px solid #a855f7;border-radius:25px;padding:14px;box-shadow:0 0 25px #a855f7aa, inset 0 0 20px #a855f755;margin-bottom:20px}

.name-box p{letter-spacing:8px;color:#c084fc;font-size:13px;margin-top:6px;font-weight:700}

/* SOCIAL BUTTONS - EXACT IMAGE STYLE */
.card {
    display:flex;
    direction:ltr;
    align-items:center;
    gap:13px;
    padding:10px 15px;
    min-height:88px;
    margin-bottom:20px;
    border-radius:35px;
    text-decoration:none;
    color:white;
    background:
      linear-gradient(145deg,#160522,#050008 55%,#210b35);
    border:3px solid #a855f7;
    outline:1px solid #e9c5ff55;
    box-shadow:
      0 0 10px #a855f7,
      0 0 22px #8b00ff99,
      inset 0 0 15px #a855f755;
    position:relative;
    transition:.3s;
}
.card:active { transform:scale(.96); }
.card .ic {
    width:65px;
    height:65px;
    min-width:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:37px;
    flex-shrink:0;
    border:3px solid #d8a5ff;
    box-shadow:0 0 15px #a855f7;
}
/* WHATSAPP */
.wa { border-color:#a855f7; box-shadow:0 0 18px #a855f7, inset 0 0 18px #a855f744; }
.wa .ic { background:#20c963; color:white; border-color:#a8ffbd; border-radius:50%; box-shadow:0 0 20px #25D366; }
/* INSTAGRAM */
.ig { border-color:#d946ef; box-shadow:0 0 18px #d946ef; }
.ig .ic { background:linear-gradient(45deg,#ffb900,#ff0069,#833ab4); color:white; border-color:#ff9af0; border-radius:20px; box-shadow:0 0 18px #e130a0; }
/* TELEGRAM */
.tg { border-color:#229ED9; box-shadow:0 0 18px #229ED9; }
.tg .ic { background:#168bd0; color:white; border-color:#8cddff; border-radius:50%; box-shadow:0 0 20px #229ED9; }
/* TIKTOK */
.tk { border-color:#d946ef; box-shadow:0 0 18px #d946ef; }
.tk .ic { background:#050505; color:white; border-color:#d946ef; border-radius:20px; text-shadow: 3px 2px #fe2c55, -3px -2px #25f4ee; box-shadow:0 0 18px #d946ef; }
/* ARROW */
.card .arr { margin-left:auto; font-size:30px; color:#e879ff; text-shadow:0 0 12px #a855f7; }
/* CROWN */
.card .crown { font-size:25px; color:#e6c7ff; text-shadow:0 0 12px #a855f7; }
/* DIVIDER */
.card .line { width:2px; height:40px; background:#d8a5ff; box-shadow:0 0 8px #a855f7; }
.card b{font-size:28px;font-family:'Great Vibes',cursive;font-weight:400;letter-spacing:1px}
.footer{margin-top:22px;color:#a855f7;font-size:12px;letter-spacing:2px}
.footer b{font-family:'Great Vibes',cursive;font-size:28px;color:#fff;letter-spacing:0;display:block}
